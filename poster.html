<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Poster Analytics</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0;background:#f5f7fb}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{padding:22px 16px;background:#fff;border-right:1px solid #e1e6ef}.brand{font-size:20px;font-weight:800}.sub,.muted{color:#7b8798}.sub{font-size:12px;margin:4px 0 24px}.navbtn{display:block;width:100%;border:0;background:transparent;text-align:left;color:#5f6b7a;padding:11px 12px;border-radius:9px;margin-bottom:7px;font-weight:700;cursor:pointer}.navbtn.active,.navbtn:hover{background:#eef4ff;color:#1f5fd6}.main{padding:24px 28px;min-width:0}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:16px}.top h1{margin:0 0 4px;font-size:26px}.filters{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.field{display:grid;gap:5px;font-size:12px;color:#657387}.field input{background:#fff;border:1px solid #d8deea;border-radius:9px;padding:9px 10px}.btn{border:0;background:#2b6df3;color:#fff;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab{border:1px solid #d8deea;background:#fff;color:#556274;border-radius:999px;padding:9px 13px;font-weight:700;cursor:pointer}.tab.active{background:#eaf2ff;border-color:#9fc0ff;color:#1f5fd6}.cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:14px}.card,.panel{background:#fff;border:1px solid #e1e6ef;border-radius:14px;box-shadow:0 3px 12px rgba(28,39,60,.04)}.card{padding:17px}.label{font-size:12px;color:#7a8798}.value{font-size:24px;font-weight:800;margin-top:7px}.panel{padding:18px;margin-bottom:14px}.panel h2{font-size:17px;margin:0 0 12px}.status{padding:12px 14px;background:#fff;border:1px solid #dce3ed;border-radius:10px;margin-bottom:14px;font-size:13px}.ok{color:#277a4a}.err{color:#c53d3d}.tablewrap{overflow:auto;border:1px solid #edf0f5;border-radius:10px}table{border-collapse:collapse;font-size:13px;min-width:100%}th,td{padding:10px 9px;border-bottom:1px solid #edf0f5;white-space:nowrap}th{background:#fafbfc;color:#6d798b;text-align:left;position:sticky;top:0}.num{text-align:right}.storecol{position:sticky;left:0;background:#fff;z-index:2;min-width:250px}.headstore{background:#fafbfc}.dayhead{text-align:center;min-width:86px}.dayhead strong{display:block}.dayhead span{font-size:11px;color:#8a96a7}.totalrow td{background:#f3f6fa;font-weight:800}.totalrow .storecol{background:#f3f6fa}.peak{background:#fff4d6!important;box-shadow:inset 0 0 0 1px #f0cf78;font-weight:800}.chart{height:260px;display:flex;align-items:flex-end;gap:4px}.col{flex:1;min-width:4px;background:#4f87ff;border-radius:4px 4px 0 0;position:relative}.col.peakbar{background:#f0b429}.col:hover:after{content:attr(data-tip);position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 8px);background:#fff;border:1px solid #d8deea;border-radius:8px;padding:7px 8px;white-space:nowrap;font-size:11px;z-index:5}.hidden{display:none}.small{font-size:12px}@media(max-width:1100px){.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:850px){.app{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="app"><aside class="side"><div class="brand">Retail Analytics</div><div class="sub">Poster POS · USD</div><button class="navbtn active" data-view="storesView">Магазины</button><button class="navbtn" data-view="productsView">Top Products</button><button class="navbtn" data-view="peopleView">Salespeople</button></aside><main class="main"><div class="top"><div><h1 id="title">Магазины</h1><div class="muted small">Данные Poster POS</div></div><div class="filters"><label class="field">С<input id="from" type="date"></label><label class="field">По<input id="to" type="date"></label><label class="field">MXN за 1 USD<input id="fx" type="number" step="0.01" value="18.50"></label><button id="load" class="btn">Обновить</button></div></div><div id="status" class="status">Проверяю подключение…</div>
<section id="storesView"><div class="tabs"><button class="tab active" data-m="revenueUsd">Продажи</button><button class="tab" data-m="checks">Количество чеков</button><button class="tab" data-m="avgCheckUsd">Средний чек</button><button class="tab" data-m="newClients">Новые клиенты</button><button class="tab" data-m="registeredClients">Зарегистрированные</button><button class="tab" data-m="returningClients">Возвращающиеся</button></div><div id="cards" class="cards"></div><div class="panel"><h2 id="tableTitle"></h2><div id="stores"></div></div><div class="panel"><h2 id="chartTitle"></h2><div id="chart" class="chart"></div></div></section>
<section id="productsView" class="hidden"><div class="panel"><h2>Top Products</h2><div id="products"></div></div></section>
<section id="peopleView" class="hidden"><div class="panel"><h2>Salespeople Dashboard</h2><div id="people"></div></div></section>
</main></div><script>
const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0),integer=n=>new Intl.NumberFormat('en-US',{maximumFractionDigits:0}).format(n||0),pct=n=>new Intl.NumberFormat('en-US',{style:'percent',maximumFractionDigits:1}).format(n||0),WD=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];let DATA=null,metric='revenueUsd',view='storesView';
const META={revenueUsd:['Продажи','Продажи по магазинам и дням','Динамика выручки',money],checks:['Количество чеков','Чеки по магазинам и дням','Количество чеков по дням',integer],avgCheckUsd:['Средний чек','Средний чек по магазинам и дням','Средний чек по дням',money],newClients:['Новые клиенты','Новые клиенты по магазинам и дням','Новые клиенты по дням',integer],registeredClients:['Зарегистрированные','Зарегистрированные клиенты по магазинам и дням','Зарегистрированные по дням',integer],returningClients:['Возвращающиеся','Возвращающиеся клиенты по магазинам и дням','Возвращающиеся по дням',integer]};
function dayLabel(s){const d=new Date(s+'T00:00:00');return{date:String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0'),wd:WD[d.getDay()]}}function init(){const d=new Date(),t=d.toISOString().slice(0,10);$('to').value=t;$('from').value=t.slice(0,8)+'01'}function status(t,c=''){$('status').className='status '+c;$('status').textContent=t}function qs(){return new URLSearchParams({from:$('from').value,to:$('to').value,fx:$('fx').value})}
async function load(){status('Загружаю данные Poster…');try{const [a,b,c]=await Promise.all([fetch('/api/poster/dashboard?'+qs()),fetch('/api/poster/products?'+qs()),fetch('/api/poster/salespeople?'+qs())]),[x,p,s]=await Promise.all([a.json(),b.json(),c.json()]);if(!a.ok)throw Error(x.error||'Poster error');DATA=x;renderStores();renderProducts(p);renderPeople(s);status(`Обновлено: ${x.from} — ${x.to}. Returning: ${x.diagnostics?.returningMethod||'—'}`,'ok')}catch(e){status(e.message,'err')}}
function renderStores(){if(!DATA)return;const t=DATA.totals;$('cards').innerHTML=`<div class="card"><div class="label">Выручка</div><div class="value">${money(t.revenueUsd)}</div></div><div class="card"><div class="label">Чеков</div><div class="value">${integer(t.checks)}</div></div><div class="card"><div class="label">Средний чек</div><div class="value">${money(t.avgCheckUsd)}</div></div><div class="card"><div class="label">Новые</div><div class="value">${integer(t.newClients)}</div></div><div class="card"><div class="label">Зарегистрированные</div><div class="value">${integer(t.registeredClients)}</div></div><div class="card"><div class="label">Возвращающиеся</div><div class="value">${integer(t.returningClients)}</div></div>`;const m=META[metric],fmt=m[3],dates=DATA.dates; $('tableTitle').textContent=m[1];$('chartTitle').textContent=m[2];const heads=dates.map(d=>{const l=dayLabel(d);return`<th class="dayhead"><strong>${l.date}</strong><span>${l.wd}</span></th>`}).join('');const rows=DATA.stores.map((s,i)=>{const vals=dates.map(d=>s.byDay?.[d]?.[metric]||0),peak=Math.max(...vals,0);return`<tr><td class="storecol"><strong>${i+1}. ${esc(s.name)}</strong></td>${vals.map(v=>`<td class="num ${peak>0&&v===peak?'peak':''}">${fmt(v)}</td>`).join('')}<td class="num"><strong>${fmt(s[metric]||0)}</strong></td></tr>`}).join('');const vals=dates.map(d=>DATA.daily.find(x=>x.date===d)?.[metric]||0),peak=Math.max(...vals,0);$('stores').innerHTML=`<div class="tablewrap"><table><thead><tr><th class="storecol headstore">Магазин</th>${heads}<th class="num">Итого</th></tr></thead><tbody>${rows}<tr class="totalrow"><td class="storecol">ОБЩИЙ ИТОГ</td>${vals.map(v=>`<td class="num ${peak>0&&v===peak?'peak':''}">${fmt(v)}</td>`).join('')}<td class="num">${fmt(t[metric]||0)}</td></tr></tbody></table></div>`;const max=Math.max(...vals,1);$('chart').innerHTML=vals.map((v,i)=>{const l=dayLabel(dates[i]);return`<div class="col ${v===peak&&v>0?'peakbar':''}" style="height:${Math.max(3,v/max*100)}%" data-tip="${l.date} ${l.wd} · ${fmt(v)}"></div>`}).join('')}
function renderProducts(x){if(x.error){$('products').textContent=x.error;return}const r=x.products||[];$('products').innerHTML=r.length?`<div class="tablewrap"><table><thead><tr><th>#</th><th>Товар</th><th class="num">Выручка</th><th class="num">Единиц</th><th class="num">Средняя цена</th><th class="num">Доля</th></tr></thead><tbody>${r.slice(0,100).map((p,i)=>`<tr><td>${i+1}</td><td><strong>${esc(p.name)}</strong></td><td class="num">${money(p.revenueUsd)}</td><td class="num">${integer(p.qty)}</td><td class="num">${money(p.avgPriceUsd)}</td><td class="num">${pct(p.share)}</td></tr>`).join('')}</tbody></table></div>`:'Poster не вернул продажи по товарам.'}
function renderPeople(x){if(x.error){$('people').textContent=x.error;return}const r=x.salespeople||[];$('people').innerHTML=r.length?`<div class="tablewrap"><table><thead><tr><th>#</th><th>Продавец</th><th class="num">Выручка</th><th class="num">Чеков</th><th class="num">Средний чек</th><th class="num">Чеков с регистрацией</th><th class="num">Registration rate</th></tr></thead><tbody>${r.map((p,i)=>`<tr><td>${i+1}</td><td><strong>${esc(p.name)}</strong></td><td class="num">${money(p.revenueUsd)}</td><td class="num">${integer(p.checks)}</td><td class="num">${money(p.avgCheckUsd)}</td><td class="num">${integer(p.registeredChecks)}</td><td class="num">${pct(p.registrationRate)}</td></tr>`).join('')}</tbody></table></div>`:'Poster не вернул идентификаторы сотрудников в транзакциях.'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{metric=b.dataset.m;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));renderStores()});document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('.navbtn').forEach(x=>x.classList.toggle('active',x===b));['storesView','productsView','peopleView'].forEach(id=>$(id).classList.toggle('hidden',id!==view));$('title').textContent=b.textContent});$('load').onclick=load;init();fetch('/api/poster/health').then(r=>r.json()).then(x=>{if(x.fx)$('fx').value=Number(x.fx).toFixed(2);if(x.configured)load();else status('Нужно добавить POSTER_TOKEN в .env','err')}).catch(()=>status('Сервер не запущен','err'));
</script></body></html>
