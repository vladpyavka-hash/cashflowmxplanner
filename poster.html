<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Poster — магазины</title><style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{padding:22px 16px;border-right:1px solid #e1e6ef;background:#fff}.brand{font-weight:800;font-size:20px}.sub,.muted{color:#7b8798}.sub{font-size:12px;margin:4px 0 24px}.nav a{display:block;color:#5f6b7a;text-decoration:none;padding:11px 12px;border-radius:9px;margin-bottom:8px}.nav a.active,.nav a:hover{background:#eef4ff;color:#1f5fd6}.main{padding:24px 28px;min-width:0}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px}.top h1{margin:0 0 4px;font-size:26px}.filters{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.field{display:grid;gap:5px;font-size:12px;color:#657387}.field input{background:#fff;color:#172033;border:1px solid #d8deea;border-radius:9px;padding:9px 10px}.btn{border:0;background:#2b6df3;color:white;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.tab{border:1px solid #d8deea;background:#fff;color:#556274;border-radius:999px;padding:9px 13px;font-weight:700;cursor:pointer}.tab.active{background:#eaf2ff;border-color:#9fc0ff;color:#1f5fd6}.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:14px}.card,.panel{background:#fff;border:1px solid #e1e6ef;border-radius:14px;box-shadow:0 3px 12px rgba(28,39,60,.04)}.card{padding:17px}.label{font-size:12px;color:#7a8798}.value{font-size:25px;font-weight:800;margin-top:7px}.panel{padding:18px;margin-bottom:14px}.panel h2{font-size:17px;margin:0 0 14px}.tablewrap{overflow:auto;max-width:100%;border:1px solid #edf0f5;border-radius:10px}table{border-collapse:collapse;font-size:13px;min-width:100%}th,td{padding:10px 9px;border-bottom:1px solid #edf0f5;text-align:left;white-space:nowrap}th{color:#6d798b;background:#fafbfc;position:sticky;top:0;z-index:2}.num{text-align:right}.storecol{position:sticky;left:0;z-index:3;background:#fff;min-width:290px;max-width:390px}.headstore{background:#fafbfc!important}.dayhead{text-align:center;min-width:88px}.dayhead strong{display:block;color:#253044}.dayhead span{font-size:11px;color:#8a96a7}.totalcol{background:#f8fafc;font-weight:700}.totalrow td{background:#f3f6fa;font-weight:800}.totalrow .storecol{background:#f3f6fa}.peak{background:#fff4d6!important;box-shadow:inset 0 0 0 1px #f0cf78;font-weight:800}.peak::after{content:' ↑';color:#b37a00;font-size:10px}.status{padding:12px 14px;border:1px solid #dce3ed;background:#fff;border-radius:10px;margin-bottom:14px;font-size:13px}.err{color:#c53d3d}.ok{color:#277a4a}.chart{height:280px;display:flex;align-items:flex-end;gap:4px;padding-top:10px}.col{flex:1;min-width:4px;background:#4f87ff;border-radius:4px 4px 0 0;position:relative}.col.peakbar{background:#f0b429}.col:hover:after{content:attr(data-tip);position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 8px);background:#fff;border:1px solid #d8deea;border-radius:8px;padding:7px 8px;white-space:nowrap;font-size:11px;z-index:5;box-shadow:0 6px 18px rgba(28,39,60,.12)}.small{font-size:12px}.hint{font-size:12px;color:#7b8798;margin-top:-6px;margin-bottom:12px}@media(max-width:1050px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:950px){.app{grid-template-columns:1fr}}@media(max-width:620px){.cards{grid-template-columns:1fr}.main{padding:18px}.top{align-items:stretch;flex-direction:column}.storecol{min-width:220px}}
</style></head><body><div class="app"><aside class="side"><div class="brand">Retail Analytics</div><div class="sub">Poster POS · USD dashboard</div><div class="nav"><a href="index.html">Денежный поток</a><a href="poster.html" class="active">Продажи магазинов</a></div></aside><main class="main"><div class="top"><div><h1>Продажи по магазинам</h1><div class="muted small">Данные Poster POS, отображение в долларах США</div></div><div class="filters"><label class="field">С<input id="from" type="date"></label><label class="field">По<input id="to" type="date"></label><label class="field">MXN за 1 USD<input id="fx" type="number" min="0.01" step="0.01" value="18.50"></label><button id="load" class="btn">Обновить</button></div></div><div class="tabs" id="tabs"><button class="tab active" data-m="revenueUsd">Продажи</button><button class="tab" data-m="checks">Количество чеков</button><button class="tab" data-m="avgCheckUsd">Средний чек</button><button class="tab" data-m="newClients">Новые клиенты</button><button class="tab" data-m="registeredClients">Зарегистрированные клиенты</button></div><div id="status" class="status">Проверяю подключение…</div><div id="cards" class="cards"></div><div class="panel"><h2 id="tableTitle">Продажи по магазинам и дням</h2><div class="hint">Пиковое значение за период в каждой строке подсвечено мягким жёлтым цветом.</div><div id="stores"></div></div><div class="panel"><h2 id="chartTitle">Динамика выручки по дням</h2><div id="chart" class="chart"></div></div></main></div><script>
const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0),integer=n=>new Intl.NumberFormat('en-US',{maximumFractionDigits:0}).format(n||0),pct=n=>new Intl.NumberFormat('ru-RU',{style:'percent',maximumFractionDigits:1}).format(n||0);const WD=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];let DATA=null,metric='revenueUsd';
const META={revenueUsd:{label:'Продажи',table:'Продажи по магазинам и дням',chart:'Динамика выручки по дням',format:money,total:s=>s.revenueUsd,daily:d=>d.revenueUsd},checks:{label:'Количество чеков',table:'Количество чеков по магазинам и дням',chart:'Количество чеков по дням',format:integer,total:s=>s.checks,daily:d=>d.checks},avgCheckUsd:{label:'Средний чек',table:'Средний чек по магазинам и дням',chart:'Средний чек по дням',format:money,total:s=>s.avgCheckUsd,daily:d=>d.avgCheckUsd},newClients:{label:'Новые клиенты',table:'Новые клиенты по магазинам и дням',chart:'Новые клиенты по дням',format:integer,total:s=>s.newClients||0,daily:d=>d.newClients||0},registeredClients:{label:'Зарегистрированные клиенты',table:'Зарегистрированные клиенты по магазинам и дням',chart:'Зарегистрированные клиенты по дням',format:integer,total:s=>s.registeredClients||0,daily:d=>d.registeredClients||0}};
function parseDate(s){const d=new Date(String(s)+'T00:00:00');return Number.isFinite(d.getTime())?d:null}function dayLabel(s){const d=parseDate(s);if(!d)return{date:s,wd:''};return{date:String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0'),wd:WD[d.getDay()]}}function initDates(){const d=new Date(),today=d.toISOString().slice(0,10);$('to').value=today;$('from').value=today.slice(0,8)+'01'}function setStatus(text,type=''){$('status').className='status '+type;$('status').textContent=text}
async function health(){try{const r=await fetch('/api/poster/health'),x=await r.json();$('fx').value=Number(x.fx||18.5).toFixed(2);setStatus(x.configured?'Poster подключен. Можно загружать данные.':'Нужно добавить POSTER_TOKEN в файл .env.',x.configured?'ok':'err');if(x.configured)load()}catch(e){setStatus('Локальный API-сервер не запущен. Открой dashboard через npm start.','err')}}
async function load(){setStatus('Загружаю данные Poster…');$('load').disabled=true;try{const q=new URLSearchParams({from:$('from').value,to:$('to').value,fx:$('fx').value}),r=await fetch('/api/poster/dashboard?'+q),x=await r.json();if(!r.ok)throw new Error(x.error||'Ошибка Poster API');DATA=x;render();const skipped=x.diagnostics?.invalidDates?` Без даты: ${x.diagnostics.invalidDates}.`:'';const clients=x.diagnostics?.clientsLoaded===0?' Клиенты из CRM не загрузились — вкладка «Новые клиенты» может быть пустой.':'';setStatus(`Обновлено: ${x.from} — ${x.to}. Курс: ${x.fx} MXN/USD.${skipped}${clients}`,'ok')}catch(e){setStatus(e.message,'err');$('cards').innerHTML='';$('stores').innerHTML='';$('chart').innerHTML=''}finally{$('load').disabled=false}}
function render(){if(!DATA)return;const x=DATA,t=x.totals;$('cards').innerHTML=`<div class="card"><div class="label">Выручка сети</div><div class="value">${money(t.revenueUsd)}</div></div><div class="card"><div class="label">Чеков</div><div class="value">${integer(t.checks)}</div></div><div class="card"><div class="label">Средний чек</div><div class="value">${money(t.avgCheckUsd)}</div></div><div class="card"><div class="label">Новых клиентов</div><div class="value">${integer(t.newClients||0)}</div></div><div class="card"><div class="label">Зарегистрированных клиентов</div><div class="value">${integer(t.registeredClients||0)}</div></div>`;const m=META[metric];$('tableTitle').textContent=m.table;$('chartTitle').textContent=m.chart;renderStoreTable(x);renderChart(x)}
function cellValue(s,d){return s.byDay?.[d]?.[metric]||0}function renderStoreTable(x){if(!x.stores.length){$('stores').innerHTML='Нет данных за выбранный период.';return}const m=META[metric],dates=x.dates||[],heads=dates.map(d=>{const l=dayLabel(d);return`<th class="dayhead"><strong>${l.date}</strong><span>${l.wd}</span></th>`}).join('');const rows=x.stores.map((s,i)=>{const vals=dates.map(d=>cellValue(s,d)),peak=Math.max(...vals,0);return`<tr><td class="storecol"><strong>${i+1}. ${esc(s.name)}</strong><div class="muted small">Poster spot ${esc(s.spotId)}</div></td>${dates.map((d,j)=>`<td class="num ${peak>0&&vals[j]===peak?'peak':''}">${m.format(vals[j])}</td>`).join('')}<td class="num totalcol">${m.format(m.total(s))}</td></tr>`}).join('');const netVals=dates.map(d=>{const q=x.daily.find(v=>v.date===d);return q?m.daily(q):0}),netPeak=Math.max(...netVals,0);$('stores').innerHTML=`<div class="tablewrap"><table><thead><tr><th class="storecol headstore">Магазин</th>${heads}<th class="num">Итого / период</th></tr></thead><tbody>${rows}<tr class="totalrow"><td class="storecol">ОБЩИЙ ИТОГ</td>${netVals.map(v=>`<td class="num ${netPeak>0&&v===netPeak?'peak':''}">${m.format(v)}</td>`).join('')}<td class="num">${m.format(metric==='avgCheckUsd'?x.totals.avgCheckUsd:x.totals[metric]||0)}</td></tr></tbody></table></div>`}
function renderChart(x){const m=META[metric],vals=x.daily.map(d=>m.daily(d)),max=Math.max(...vals,1);$('chart').innerHTML=x.daily.map((d,i)=>{const l=dayLabel(d.date),v=vals[i];return`<div class="col ${v>0&&v===Math.max(...vals)?'peakbar':''}" style="height:${Math.max(3,v/max*100)}%" data-tip="${l.date} ${l.wd} · ${m.format(v)}"></div>`}).join('')||'<div class="muted">Нет данных.</div>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{metric=b.dataset.m;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});$('load').onclick=load;initDates();health();
</script></body></html>
