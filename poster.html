<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Poster — магазины</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e8eef7;background:#07111f}*{box-sizing:border-box}body{margin:0;background:#07111f;color:#e8eef7}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{padding:22px 16px;border-right:1px solid #1d2b3d;background:#0a1625}.brand{font-weight:800;font-size:20px}.sub,.muted{color:#8293a8}.sub{font-size:12px;margin:4px 0 24px}.nav a{display:block;color:#a9b8cb;text-decoration:none;padding:11px 12px;border-radius:9px;margin-bottom:8px}.nav a.active,.nav a:hover{background:#13243a;color:#fff}.main{padding:24px 28px;min-width:0}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px}.top h1{margin:0 0 4px;font-size:26px}.filters{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.field{display:grid;gap:5px;font-size:12px;color:#91a3b8}.field input{background:#0d1b2b;color:white;border:1px solid #263950;border-radius:9px;padding:9px 10px}.btn{border:0;background:#2b6df3;color:white;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}.card,.panel{background:#0c1929;border:1px solid #1c2e43;border-radius:14px}.card{padding:17px}.label{font-size:12px;color:#8fa0b5}.value{font-size:25px;font-weight:800;margin-top:7px}.panel{padding:18px;margin-bottom:14px}.panel h2{font-size:17px;margin:0 0 14px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:11px 9px;border-bottom:1px solid #1a2a3d;text-align:left;white-space:nowrap}th{color:#8091a6}.num{text-align:right}.bar{width:100%;height:7px;background:#102236;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:#4f87ff}.status{padding:12px 14px;border:1px solid #263950;background:#0d1b2b;border-radius:10px;margin-bottom:14px;font-size:13px}.err{color:#ff9c9c}.ok{color:#70d9a2}.chart{height:280px;display:flex;align-items:flex-end;gap:4px;padding-top:10px}.col{flex:1;min-width:4px;background:#2b6df3;border-radius:4px 4px 0 0;position:relative}.col:hover:after{content:attr(data-tip);position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 8px);background:#07111f;border:1px solid #31455e;border-radius:8px;padding:7px 8px;white-space:nowrap;font-size:11px;z-index:5}.grid2{display:grid;grid-template-columns:2fr 1fr;gap:14px}.small{font-size:12px}@media(max-width:950px){.app{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}@media(max-width:620px){.cards{grid-template-columns:1fr}.main{padding:18px}.top{align-items:stretch;flex-direction:column}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="brand">Retail Analytics</div><div class="sub">Poster POS · USD dashboard</div><div class="nav"><a href="index.html">Денежный поток</a><a href="poster.html" class="active">Продажи магазинов</a></div></aside>
<main class="main">
<div class="top"><div><h1>Продажи по магазинам</h1><div class="muted small">Данные Poster POS, отображение в долларах США</div></div><div class="filters"><label class="field">С<input id="from" type="date"></label><label class="field">По<input id="to" type="date"></label><label class="field">MXN за 1 USD<input id="fx" type="number" min="0.01" step="0.01" value="18.50"></label><button id="load" class="btn">Обновить</button></div></div>
<div id="status" class="status">Проверяю подключение…</div>
<div id="cards" class="cards"></div>
<div class="grid2"><div class="panel"><h2>Магазины</h2><div id="stores"></div></div><div class="panel"><h2>Доля выручки</h2><div id="shares"></div></div></div>
<div class="panel"><h2>Динамика выручки по дням</h2><div id="chart" class="chart"></div></div>
</main></div>
<script>
const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n||0),pct=n=>new Intl.NumberFormat('ru-RU',{style:'percent',maximumFractionDigits:1}).format(n||0),fmtDate=s=>s?new Intl.DateTimeFormat('ru-RU',{day:'2-digit',month:'short'}).format(new Date(s+'T00:00:00')):'—';
function initDates(){const d=new Date(),today=d.toISOString().slice(0,10);$('to').value=today;$('from').value=today.slice(0,8)+'01'}
function setStatus(text,type=''){$('status').className='status '+type;$('status').textContent=text}
async function health(){try{const r=await fetch('/api/poster/health'),x=await r.json();$('fx').value=Number(x.fx||18.5).toFixed(2);setStatus(x.configured?'Poster подключен. Можно загружать данные.':'Нужно добавить POSTER_TOKEN в файл .env.',x.configured?'ok':'err');if(x.configured)load()}catch(e){setStatus('Локальный API-сервер не запущен. Откройте dashboard через npm start, а не двойным кликом по HTML.','err')}}
async function load(){setStatus('Загружаю данные Poster…');$('load').disabled=true;try{const q=new URLSearchParams({from:$('from').value,to:$('to').value,fx:$('fx').value});const r=await fetch('/api/poster/dashboard?'+q),x=await r.json();if(!r.ok)throw new Error(x.error||'Ошибка Poster API');render(x);setStatus(`Обновлено: ${x.from} — ${x.to}. Курс: ${x.fx} MXN/USD.`,'ok')}catch(e){setStatus(e.message,'err');$('cards').innerHTML='';$('stores').innerHTML='';$('shares').innerHTML='';$('chart').innerHTML=''}finally{$('load').disabled=false}}
function render(x){const t=x.totals;$('cards').innerHTML=`<div class="card"><div class="label">Выручка сети</div><div class="value">${money(t.revenueUsd)}</div></div><div class="card"><div class="label">Чеков</div><div class="value">${t.checks.toLocaleString('en-US')}</div></div><div class="card"><div class="label">Средний чек</div><div class="value">${money(t.avgCheckUsd)}</div></div><div class="card"><div class="label">Магазинов с продажами</div><div class="value">${t.stores}</div></div>`;
$('stores').innerHTML=x.stores.length?`<div class="tablewrap"><table><tr><th>Магазин</th><th class="num">Продажи</th><th class="num">Чеки</th><th class="num">Средний чек</th><th class="num">Доля</th></tr>${x.stores.map(s=>`<tr><td><strong>${esc(s.name)}</strong><div class="muted small">Poster spot ${esc(s.spotId)}</div></td><td class="num">${money(s.revenueUsd)}</td><td class="num">${s.checks.toLocaleString('en-US')}</td><td class="num">${money(s.avgCheckUsd)}</td><td class="num">${pct(s.share)}</td></tr>`).join('')}</table></div>`:'Нет продаж за выбранный период.';
$('shares').innerHTML=x.stores.map(s=>`<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;gap:12px;margin-bottom:6px"><span>${esc(s.name)}</span><strong>${pct(s.share)}</strong></div><div class="bar"><span style="width:${Math.max(1,s.share*100)}%"></span></div></div>`).join('')||'—';
const max=Math.max(...x.daily.map(d=>d.revenueUsd),1);$('chart').innerHTML=x.daily.map(d=>`<div class="col" style="height:${Math.max(3,d.revenueUsd/max*100)}%" data-tip="${fmtDate(d.date)} · ${money(d.revenueUsd)} · ${d.checks} чек."></div>`).join('')||'<div class="muted">Нет данных.</div>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('load').onclick=load;initDates();health();
</script>
</body></html>
